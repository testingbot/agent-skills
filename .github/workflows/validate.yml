name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Monday — catches doc URLs that rotted over the week

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Structural validation
        run: python3 scripts/validate_skills.py
      - name: Unit and functional tests
        run: python3 -m pytest -q

  links:
    # Network-dependent, so it must not block a PR on a transient failure.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Documented URLs resolve
        run: python3 -m pytest tests/test_links.py -q -m network
